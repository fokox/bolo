name: Build Android APK

    'on':
      push:
        branches:
          - main
        paths:
          - 'android/**'
          - '.github/workflows/**'
      workflow_dispatch: {}

    permissions:
      contents: write

    jobs:
      build-apk:
        name: Build Android APK
        runs-on: ubuntu-latest

        steps:
          - name: Checkout Repository
            uses: actions/checkout@v4

          - name: Set up Java JDK 17
            uses: actions/setup-java@v4
            with:
              distribution: 'temurin'
              java-version: '17'

          - name: Set up Gradle
            uses: gradle/actions/setup-gradle@v3
            with:
              gradle-version: '8.5'

          - name: Build Android Debug APK
            working-directory: android
            run: |
              gradle assembleDebug --no-daemon

          - name: Upload APK Artifact
            uses: actions/upload-artifact@v4
            with:
              name: bolo-android-apk
              path: android/app/build/outputs/apk/debug/app-debug.apk
              retention-days: 30

          - name: Create GitHub Release with APK
            uses: softprops/action-gh-release@v2
            if: startsWith(github.ref, 'refs/heads/main')
            with:
              tag_name: android-v${{ github.run_number }}
              name: Bolo Android App v1.0.${{ github.run_number }}
              body: |
                ### 📱 Bolo for Android
                Download and install the latest Android APK directly on your phone:
                * **Build:** Automated build #${{ github.run_number }}
              files: |
                android/app/build/outputs/apk/debug/app-debug.apk
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
